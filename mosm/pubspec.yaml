name: mosm
description: "Medical Order & Stock Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔥 Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # 🔐 Google Login
  google_sign_in: ^6.2.1

  # 🌐 API Calls
  http: ^1.2.2
  dio: ^5.4.0

  # ⚡ State Management (recommended)
  flutter_riverpod: ^2.5.1

  # 🧠 JSON parsing
  json_annotation: ^4.9.0

  # 🧾 Formatting (dates, etc.)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 🔧 Model generator
  build_runner: ^2.4.12
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
